# Railway читает этот файл и знает, как запускать бота.
# Это не сайт: HTTP-порт и публичный домен не нужны.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "python telegram_meny_abmrab.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Один бот = одна линия к Telegram. Старый деплой гасим сразу, без нахлёста.
overlapSeconds = 0
